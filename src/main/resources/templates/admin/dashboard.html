<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <section class="section-padding">
            <div class="container">

                <div class="text-center mb-5">
                    <span class="section-label">ADMINISTRATION</span>
                    <h1 class="section-title mt-2">Admin Dashboard</h1>
                    <p class="section-description mx-auto">Overview of the courses stored in Project Scholar.</p>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-4">
                        <div class="feature-card text-center">
                            <h2 th:text="${totalCourses}">0</h2>
                            <p class="mb-0">Total Courses</p>
                        </div>
                    </div>
                    <div class="col-md-4" th:each="entry : ${statusCounts}">
                        <div class="feature-card text-center">
                            <h2 th:text="${entry.value}">0</h2>
                            <p class="mb-0" th:text="${entry.key}">STATUS</p>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-wrap justify-content-center gap-3">
                    <a th:href="@{/admin/courses}" class="btn btn-primary-custom">Manage Courses</a>
                    <a th:href="@{/catalog}" class="btn btn-outline-custom">View Public Catalog</a>
                </div>

            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
