<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle}">Edit Course</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Shared Project Scholar stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Shared Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <section class="section-padding">
            <div class="container">

                <div class="row justify-content-center">
                    <div class="col-lg-8">

                        <!-- Page Heading -->
                        <div class="mb-4">
                            <span class="section-label">ADMINISTRATION</span>
                            <h1 class="section-title mt-2">Edit Course</h1>
                            <p class="section-description">
                                Update the course details below. Changes appear in the public catalog right away.
                            </p>
                        </div>

                        <!-- Course Edit Form -->
                        <div class="card shadow-sm border-0 rounded-4">
                            <div class="card-body p-4 p-md-5">

                                <h3 class="fw-bold mb-2">Course Information</h3>

                                <p class="text-secondary mb-4">
                                    Fix anything that needs changing, then save.
                                </p>

                                <form th:action="@{/admin/courses/{id}/edit(id=${courseId})}"
                                      th:object="${courseForm}"
                                      method="post"
                                      novalidate>

                                    <!-- Course Code -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold" for="courseCode">Course Code</label>
                                        <input type="text"
                                               class="form-control"
                                               th:field="*{courseCode}"
                                               th:errorclass="is-invalid"
                                               placeholder="e.g. CPAN228">
                                        <div class="invalid-feedback" th:errors="*{courseCode}"></div>
                                    </div>

                                    <!-- Course Title -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold" for="title">Course Title</label>
                                        <input type="text"
                                               class="form-control"
                                               th:field="*{title}"
                                               th:errorclass="is-invalid"
                                               placeholder="Web Application Development">
                                        <div class="invalid-feedback" th:errors="*{title}"></div>
                                    </div>

                                    <!-- Description -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold" for="description">Description</label>
                                        <textarea class="form-control"
                                                  th:field="*{description}"
                                                  th:errorclass="is-invalid"
                                                  rows="4"
                                                  placeholder="What will students learn?"></textarea>
                                        <div class="invalid-feedback" th:errors="*{description}"></div>
                                    </div>

                                    <!-- Category -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold" for="category">Category</label>
                                        <select class="form-select"
                                                th:field="*{category}"
                                                th:errorclass="is-invalid">
                                            <option value="">-- Select Category --</option>
                                            <option value="Programming">Programming</option>
                                            <option value="Mathematics">Mathematics</option>
                                            <option value="Science">Science</option>
                                            <option value="Business">Business</option>
                                            <option value="Languages">Languages</option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{category}"></div>
                                    </div>

                                    <!-- Instructor -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold" for="instructorId">Instructor</label>
                                        <select class="form-select"
                                                th:field="*{instructorId}"
                                                th:errorclass="is-invalid">
                                            <option value="">-- Select Instructor --</option>
                                            <option th:each="instructor : ${instructors}"
                                                    th:value="${instructor.instructorId}"
                                                    th:text="${instructor.firstName + ' ' + instructor.lastName}">
                                            </option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{instructorId}"></div>
                                    </div>

                                    <!-- Start and End Dates -->
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-semibold" for="startDate">Start Date</label>
                                            <input type="date"
                                                   class="form-control"
                                                   th:field="*{startDate}"
                                                   th:errorclass="is-invalid">
                                            <div class="invalid-feedback" th:errors="*{startDate}"></div>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-semibold" for="endDate">End Date</label>
                                            <input type="date"
                                                   class="form-control"
                                                   th:field="*{endDate}"
                                                   th:errorclass="is-invalid">
                                            <div class="invalid-feedback" th:errors="*{endDate}"></div>
                                        </div>
                                    </div>

                                    <!-- Maximum Students -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold" for="maxStudents">Maximum Students</label>
                                        <input type="number"
                                               class="form-control"
                                               th:field="*{maxStudents}"
                                               th:errorclass="is-invalid"
                                               min="1"
                                               placeholder="30">
                                        <div class="invalid-feedback" th:errors="*{maxStudents}"></div>
                                    </div>

                                    <!-- Course Status -->
                                    <div class="mb-4">
                                        <label class="form-label fw-semibold" for="status">Course Status</label>
                                        <select class="form-select"
                                                th:field="*{status}"
                                                th:errorclass="is-invalid">
                                            <option th:each="statusOption : ${statuses}"
                                                    th:value="${statusOption}"
                                                    th:text="${statusOption}">
                                            </option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{status}"></div>
                                    </div>

                                    <!-- Form Actions -->
                                    <div class="d-flex flex-wrap gap-3 mt-4">
                                        <button type="submit" class="btn btn-primary-custom">Save Changes</button>
                                        <a th:href="@{/admin/courses}" class="btn btn-outline-custom">Cancel</a>
                                    </div>

                                </form>

                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Shared Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
