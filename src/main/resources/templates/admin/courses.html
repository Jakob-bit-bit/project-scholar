<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Manage Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <section class="section-padding">
            <div class="container">

                <div class="text-center mb-4">
                    <span class="section-label">ADMINISTRATION</span>
                    <h1 class="section-title mt-2">Manage Courses</h1>
                </div>

                <!-- Flash messages (used by edit and delete later) -->
                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <div th:if="${#lists.isEmpty(courses)}" class="alert alert-info text-center">
                    There are no courses yet.
                </div>

                <div class="feature-card" th:unless="${#lists.isEmpty(courses)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Instructor</th>
                                    <th>Status</th>
                                    <th>Capacity</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="course : ${courses}">
                                    <td th:text="${course.courseCode}">CODE101</td>
                                    <td class="fw-semibold" th:text="${course.title}">Title</td>
                                    <td th:text="${course.category}">Category</td>
                                    <td th:text="${course.instructor.firstName} + ' ' + ${course.instructor.lastName}">Instructor</td>
                                    <td><span class="badge text-bg-secondary" th:text="${course.status}">STATUS</span></td>
                                    <td th:text="${course.maxStudents}">30</td>
                                    <td class="text-end">
                                        <a class="btn btn-sm btn-outline-custom"
                                           th:href="@{/admin/courses/{id}/edit(id=${course.courseId})}">Edit</a>

                                        <form th:action="@{/admin/courses/{id}/delete(id=${course.courseId})}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Delete this course? This cannot be undone.');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a th:href="@{/admin}" class="btn btn-outline-custom">Back to Dashboard</a>
                </div>

            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
