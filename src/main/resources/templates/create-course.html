
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle}">Create Course</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="mb-4">
                    <h1 class="fw-bold">Create New Course</h1>
                    <p class="text-secondary">
                        Add a new course to the Project Scholar catalog.
                    </p>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <form th:action="@{/courses}"
                              th:object="${courseForm}"
                              method="post"
                              novalidate>

                            <!-- Course Code -->
                            <div class="mb-3">
                                <label class="form-label"
                                       for="courseCode">
                                    Course Code
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{courseCode}"
                                       th:errorclass="is-invalid"
                                       placeholder="e.g. CPAN228">

                                <div class="invalid-feedback"
                                     th:errors="*{courseCode}">
                                </div>
                            </div>

                            <!-- Course Title -->
                            <div class="mb-3">
                                <label class="form-label"
                                       for="title">
                                    Course Title
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{title}"
                                       th:errorclass="is-invalid"
                                       placeholder="Web Application Development">

                                <div class="invalid-feedback"
                                     th:errors="*{title}">
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label class="form-label"
                                       for="description">
                                    Description
                                </label>

                                <textarea class="form-control"
                                          th:field="*{description}"
                                          th:errorclass="is-invalid"
                                          rows="4"
                                          placeholder="What will students learn?">
                                </textarea>

                                <div class="invalid-feedback"
                                     th:errors="*{description}">
                                </div>
                            </div>

                            <!-- Category -->
                            <div class="mb-3">
                                <label class="form-label"
                                       for="category">
                                    Category
                                </label>

                                <select class="form-select"
                                        th:field="*{category}"
                                        th:errorclass="is-invalid">

                                    <option value="">
                                        -- Select Category --
                                    </option>
                                    <option value="Programming">Programming</option>
                                    <option value="Mathematics">Mathematics</option>
                                    <option value="Science">Science</option>
                                    <option value="Business">Business</option>
                                    <option value="Languages">Languages</option>

                                </select>

                                <div class="invalid-feedback"
                                     th:errors="*{category}">
                                </div>
                            </div>

                            <!-- Instructor -->
                            <div class="mb-3">
                                <label class="form-label"
                                       for="instructorId">
                                    Instructor
                                </label>

                                <select class="form-select"
                                        th:field="*{instructorId}"
                                        th:errorclass="is-invalid">

                                    <option value="">
                                        -- Select Instructor --
                                    </option>

                                    <option th:each="instructor : ${instructors}"
                                            th:value="${instructor.instructorId}"
                                            th:text="${instructor.firstName + ' ' + instructor.lastName}">
                                    </option>

                                </select>

                                <div class="invalid-feedback"
                                     th:errors="*{instructorId}">
                                </div>
                            </div>

                            <!-- Start and End Dates -->
                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label"
                                           for="startDate">
                                        Start Date
                                    </label>

                                    <input type="date"
                                           class="form-control"
                                           th:field="*{startDate}"
                                           th:errorclass="is-invalid">

                                    <div class="invalid-feedback"
                                         th:errors="*{startDate}">
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label"
                                           for="endDate">
                                        End Date
                                    </label>

                                    <input type="date"
                                           class="form-control"
                                           th:field="*{endDate}"
                                           th:errorclass="is-invalid">

                                    <div class="invalid-feedback"
                                         th:errors="*{endDate}">
                                    </div>
                                </div>

                            </div>

                            <!-- Maximum Students -->
                            <div class="mb-3">
                                <label class="form-label"
                                       for="maxStudents">
                                    Maximum Students
                                </label>

                                <input type="number"
                                       class="form-control"
                                       th:field="*{maxStudents}"
                                       th:errorclass="is-invalid"
                                       min="1"
                                       placeholder="30">

                                <div class="invalid-feedback"
                                     th:errors="*{maxStudents}">
                                </div>
                            </div>

                            <!-- Course Status  -->
                            <div class="mb-4">
                                <label class="form-label"
                                       for="status">
                                    Course Status
                                </label>

                                <select class="form-select"
                                        th:field="*{status}"
                                        th:errorclass="is-invalid">

                                    <option th:each="statusOption : ${statuses}"
                                            th:value="${statusOption}"
                                            th:text="${statusOption}">
                                    </option>

                                </select>

                                <div class="invalid-feedback"
                                     th:errors="*{status}">
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit"
                                        class="btn btn-primary">
                                    Create Course
                                </button>

                                <a th:href="@{/catalog}"
                                   class="btn btn-outline-secondary">
                                    Cancel
                                </a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
