<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Project Scholar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="auth-main">

        <section class="auth-section">

            <div class="auth-card">

                <h1 class="auth-title">Create Your Account</h1>

                <p class="auth-description">
                    Join Project Scholar and start your learning journey.
                </p>

                <!-- Registration Form -->
                <form th:action="@{/register}"
                      th:object="${registrationForm}"
                      method="post"
                      class="auth-form">

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input type="text"
                               id="username"
                               th:field="*{username}"
                               class="form-control"
                               placeholder="Choose a username">

                        <small class="auth-field-error"
                               th:if="${#fields.hasErrors('username')}"
                               th:errors="*{username}">
                        </small>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Enter your email">

                        <small class="auth-field-error"
                               th:if="${#fields.hasErrors('email')}"
                               th:errors="*{email}">
                        </small>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input type="password"
                               id="password"
                               th:field="*{password}"
                               class="form-control"
                               placeholder="Create a password">

                        <small class="auth-field-error"
                               th:if="${#fields.hasErrors('password')}"
                               th:errors="*{password}">
                        </small>
                    </div>

                    <!-- Instructor Option -->
                    <div class="auth-checkbox">

                        <input type="checkbox"
                               id="registerAsInstructor"
                               th:field="*{registerAsInstructor}">

                        <label for="registerAsInstructor">
                            Register as an instructor
                        </label>

                    </div>

                    <button type="submit" class="auth-submit">
                        Create Account
                    </button>

                </form>

                <p class="auth-footer">
                    Already have an account?
                    <a th:href="@{/login}">Log in</a>
                </p>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
