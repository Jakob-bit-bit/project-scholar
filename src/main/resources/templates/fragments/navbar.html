<nav th:fragment="navbar"
     class="navbar navbar-expand-lg bg-white border-bottom"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div class="container">

        <a class="navbar-brand fw-bold d-flex align-items-center gap-2"
           th:href="@{/}">
            <img th:src="@{/images/Project-Scholar.png}"
                 alt="Project Scholar Logo"
                 class="navbar-logo">
            <span>Project Scholar</span>
        </a>

        <!-- Mobile Navigation Toggle -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <div class="navbar-nav ms-auto align-items-lg-center">

                <!-- Public Navigation: Visitors -->
                <th:block sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/}">Home</a>
                    <a class="nav-link" th:href="@{/about}">About</a>
                    <a class="nav-link" th:href="@{/explore-learning}">
                        Explore Learning
                    </a>
                    <a class="nav-link" th:href="@{/login}">Sign In</a>
                    <a class="nav-link" th:href="@{/register}">Register</a>
                </th:block>

                <!-- Course Catalog: All Authenticated Users -->
                <a class="nav-link"
                   th:href="@{/catalog}"
                   sec:authorize="isAuthenticated()">
                    Course Catalog
                </a>

                <!-- Student Navigation -->
                <th:block sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/explore-learning}">
                        Explore Learning
                    </a>
                </th:block>

                <!-- Instructor Navigation -->
                <th:block sec:authorize="hasRole('INSTRUCTOR')">
                    <a class="nav-link" th:href="@{/explore-learning}">
                        Explore Learning
                    </a>

                    <a class="nav-link" th:href="@{/courses/new}">
                        Create Course
                    </a>
                </th:block>

                <!-- Admin Navigation -->
                <th:block sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">
                        Admin Dashboard
                    </a>

                    <a class="nav-link" th:href="@{/admin/courses}">
                        Manage Courses
                    </a>
                </th:block>

                <!-- Authenticated User Information -->
                <span class="nav-link"
                      sec:authorize="isAuthenticated()">
                    Welcome, <span sec:authentication="name"></span>!
                </span>

                <!-- Display User Role -->
                <span class="nav-link"
                      sec:authorize="isAuthenticated()"
                      th:text="${#authentication.authorities[0].authority.replace('ROLE_', '')}">
                </span>

                <!-- Logout: POST Request -->
                <form th:action="@{/logout}"
                      method="post"
                      class="d-flex align-items-center"
                      sec:authorize="isAuthenticated()">

                    <button type="submit"
                            class="btn btn-outline-danger btn-sm ms-lg-2">
                        Logout
                    </button>

                </form>

            </div>
        </div>
    </div>
</nav>
